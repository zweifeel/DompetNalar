name: Android CI & PRD Update

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Android Debug Keystore
        run: |
          mkdir -p ~/.android
          mkdir -p ~/.config/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp ~/.android/debug.keystore ~/.config/.android/debug.keystore

      - name: Create Dummy google-services.json if missing
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo '{
              "project_info": { "project_number": "000000000000", "project_id": "finsmart-dummy", "storage_bucket": "finsmart.appspot.com" },
              "client": [{ "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "com.example.finsmart" } }, "api_key": [{ "current_key": "AIzaSyDummyKeyForBuildOnly" }] }]
            }' > app/google-services.json
          fi

      - name: Update PRD via Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -f "scripts/update_prd.py" ]; then
            python3 scripts/update_prd.py || echo "PRD update skipped"
          fi

      - name: Build Debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinSmart-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
