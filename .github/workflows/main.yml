name: FinSmart CI/CD Master Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  pipeline:
    name: Auto-Update PRD & Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Auto-Update PRD.md with Gemini AI
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UPDATE_NOTES: ${{ github.event.head_commit.message || 'Pembaruan fitur OCR Gemini dan optimasi sistem FinSmart' }}
        run: |
          python3 scripts/update_prd.py || echo "Peringatan: Pembaruan PRD otomatis dilewati jika API key belum siap."

      - name: 4. Commit & Push Updated PRD.md
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s PRD.md) ]]; then
            git add PRD.md
            git commit -m "docs: auto-update PRD.md via Gemini AI [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || true
          else
            echo "Tidak ada perubahan pada PRD.md"
          fi

      - name: 5. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 6. Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 7. Grant Execute Permission for Gradlew
        run: chmod +x gradlew || true

      - name: 8. Inject Secrets & Build Debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          ./gradlew assembleDebug --no-daemon || gradle assembleDebug

      - name: 9. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinSmart-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
