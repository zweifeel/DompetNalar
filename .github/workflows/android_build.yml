name: FinSmart Android CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test FinSmart Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Gradle Caching
        uses: gradle/actions/setup-gradle@v3

      - name: 4. Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: 5. Run Unit Tests (FinSmartUnitTest)
        run: gradle testDebugUnitTest

      - name: 6. Build APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          ./gradlew assembleDebug --no-daemon || gradle assembleDebug

      - name: 7. Upload Build Artifacts (APK)
        uses: actions/upload-artifact@v4
        with:
          name: FinSmart-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
