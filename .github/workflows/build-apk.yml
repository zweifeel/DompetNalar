name: Build & Package FinSmart APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Auto-Versioned Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Extract Version Info
        id: version_step
        run: |
          VERSION_NAME="1.0.3"
          VERSION_CODE="3"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "Building FinSmart v${VERSION_NAME} (Build ${VERSION_CODE})"

      - name: Build Release APK
        run: |
          gradle assembleRelease || gradle assembleDebug

      - name: Rename APK to Auto-Version Format
        run: |
          mkdir -p build-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/FinSmart_v${{ steps.version_step.outputs.VERSION_NAME }}.apk \;
          echo "Generated APK: build-output/FinSmart_v${{ steps.version_step.outputs.VERSION_NAME }}.apk"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FinSmart-v${{ steps.version_step.outputs.VERSION_NAME }}-APK
          path: build-output/*.apk
          retention-days: 30
- name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
