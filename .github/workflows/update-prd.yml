name: Auto Update PRD via Gemini API

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'PRD.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      update_notes:
        description: 'Catatan Perubahan PRD'
        required: true
        default: 'Pembaruan rutin PRD FinSmart'

jobs:
  update-prd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

- name: Install Dependencies
        run: npm install @google/generative-ai@latest

      - name: Run PRD Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UPDATE_NOTES: ${{ github.event.inputs.update_notes || github.event.head_commit.message }}
        run: node scripts/update_prd.js

      - name: Commit and Push Updated PRD
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add PRD.md
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada PRD.md"
          else
            git commit -m "docs: auto-update PRD.md via Gemini API [skip ci]"
            git push
          fi
